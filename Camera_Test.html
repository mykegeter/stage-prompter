<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Test</title>
<style>body{margin:0;background:#111;color:#eee;font-family:system-ui,sans-serif}#v{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#p{position:fixed;left:0;right:0;top:0;padding:16px;background:rgba(0,0,0,.6);font-size:16px;line-height:1.5}
button{font-size:18px;padding:12px 18px;margin:6px 6px 0 0;border-radius:10px;border:0;background:#f5a623;color:#000;font-weight:700}
.ok{color:#58d68d}.bad{color:#ff6b6b}</style></head><body>
<video id="v" playsinline muted autoplay></video>
<div id="p"><b>Stage Prompter camera test (HD)</b><div id="r"></div>
<button id="go">Start front camera</button><button id="flip">Flip</button></div>
<script>
const r=document.getElementById('r');let facing='user',stream=null;
const line=(t,ok)=>{r.innerHTML+=`<div class="${ok===true?'ok':ok===false?'bad':''}">${t}</div>`;};
line('Page address type: '+location.protocol);
line('Secure context: '+(window.isSecureContext?'YES':'NO'),window.isSecureContext);
line('Camera API present: '+(!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)?'YES':'NO'),!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia));
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false});
  const v=document.getElementById('v');v.srcObject=stream;v.style.transform=facing==='user'?'scaleX(-1)':'none';await v.play();
  const s=stream.getVideoTracks()[0].getSettings();line(`✓ Camera ON (${facing==='user'?'front':'rear'}) ${s.width||'?'}×${s.height||'?'} — the app CAN use the camera this way.`,true);}
 catch(e){line('✗ Camera failed: '+e.name+' — '+e.message,false);}}
document.getElementById('go').onclick=start;
document.getElementById('flip').onclick=()=>{facing=facing==='user'?'environment':'user';start();};
</script></body></html>
